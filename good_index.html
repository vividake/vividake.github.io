<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Neon Glass Card</title>
    <style>
        body {
            margin: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #1f4068, #162447, #1a1a2e);
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            position: relative; width: 320px; padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; text-align: center; color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .card h1 { margin: 0 0 10px; font-size: 24px; color: #00fff5; }
        .card p { margin: 0; font-size: 14px; color: #a0aec0; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SeSac 3기</h1>
        <p>깃허브 페이지에 배포된<br>개쩌는 글래스모피즘 테스트 화면입니다.</p>
    </div>
</body>
</html>
