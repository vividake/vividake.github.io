<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic 3D Card</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #090a0f;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        .bg-glow {
            position: absolute; width: 400px; height: 400px;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            filter: blur(100px); opacity: 0.4;
            border-radius: 50%; z-index: 0;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        @keyframes floatGlow {
            0% { transform: translate(-100px, -100px) scale(0.9); }
            100% { transform: translate(100px, 100px) scale(1.1); }
        }

        .card {
            position: relative; width: 360px; padding: 50px 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; text-align: center; color: #fff;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            z-index: 1;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            box-shadow: 0 40px 80px rgba(0,223,216,0.2), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .card h1 {
            margin: 0 0 15px; font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, #00dfd8, #007cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateZ(40px);
        }

        .card p {
            margin: 0; font-size: 15px; color: #a0aec0; line-height: 1.6;
            transform: translateZ(20px);
        }

        .holo-shine {
            position: absolute; inset: 0; border-radius: 24px;
            pointer-events: none; opacity: 0;
            background: radial-gradient(circle at var(--x) var(--y), rgba(255,255,255,0.25) 0%, transparent 70%);
            transition: opacity 0.3s;
        }
        .card:hover .holo-shine { opacity: 1; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="card" id="card">
        <div class="holo-shine"></div>
        <h1>SeSesac 3기 🚀</h1>
        <p>마우스 움직임에 반응하는<br>초기화면 홀로그램 3D 카드입니다.</p>
    </div>

    <script>
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = -(y - centerY) / 8;
            const rotateY = (x - centerX) / 8;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            card.style.setProperty('--x', `${x}px`);
            card.style.setProperty('--y', `${y}px`);
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
