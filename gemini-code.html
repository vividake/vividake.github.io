<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Falling Teddy Bears</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #090a0f; /* 기존 어두운 배경 유지 */
            overflow: hidden; /* 스크롤 방지 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            perspective: 1000px;
        }

        /* 기존 3D 카드 스타일 */
        .card {
            position: relative;
            width: 360px;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            text-align: center;
            color: #fff;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            z-index: 1; /* 곰돌이보다 위에 오도록 설정 */
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            box-shadow: 0 40px 80px rgba(0,223,216,0.2), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .card h1 {
            margin: 0 0 15px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00dfd8, #007cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateZ(40px);
        }

        .card p {
            margin: 0;
            font-size: 15px;
            color: #a0aec0;
            line-height: 1.6;
            transform: translateZ(20px);
        }

        /* 곰돌이 스타일 (초기에는 카드 뒤에 숨김) */
        .teddy-bear {
            position: absolute;
            font-size: 50px; /* 곰돌이 크기 */
            z-index: 0; /* 카드보다 아래 */
            opacity: 0; /* 초기에는 안보이게 */
            pointer-events: none; /* 클릭 무시 */
            animation: fall linear infinite;
        }

        /* 곰돌이 떨어지는 애니메이션 */
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="holo-shine"></div>
        <h1>SeSesac 3기 🚀</h1>
        <p>마우스 움직임에 반응하는<br>초기화면 홀로그램 3D 카드입니다.</p>
    </div>

    <!-- 곰돌이 효과 스크립트 -->
    <script>
        const card = document.getElementById('card');
        const body = document.body;

        // 곰돌이 이모지 배열 (원하는 다른 이모지를 추가할 수 있습니다.)
        const teddyBears = ['🐻'];

        // 곰돌이 생성 함수
        function createTeddyBear() {
            const bear = document.createElement('div');
            bear.classList.add('teddy-bear');
            bear.innerText = teddyBears[Math.floor(Math.random() * teddyBears.length)];

            // 랜덤한 위치와 크기 설정
            const startX = Math.random() * body.offsetWidth;
            const animationDuration = Math.random() * 3 + 2; // 2~5초 사이 랜덤
            const startSize = Math.random() * 20 + 30; // 30~50px 사이 랜덤

            bear.style.left = `${startX}px`;
            bear.style.animationDuration = `${animationDuration}s`;
            bear.style.fontSize = `${startSize}px`;

            body.appendChild(bear);

            // 애니메이션이 끝나면 요소 제거
            bear.addEventListener('animationend', () => {
                bear.remove();
            });
        }

        // 클릭 시 곰돌이 쏟아지기
        card.addEventListener('click', () => {
            // 50개의 곰돌이를 동시에 생성
            for (let i = 0; i < 50; i++) {
                setTimeout(createTeddyBear, i * 10); // 약간의 시간차를 두고 생성
            }
        });

        // 기존 3D 카드 효과 스크립트
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = -(y - centerY) / 8;
            const rotateY = (x - centerX) / 8;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            card.style.setProperty('--x', `${x}px`);
            card.style.setProperty('--y', `${y}px`);
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
